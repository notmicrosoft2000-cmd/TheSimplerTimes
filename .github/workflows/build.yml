name: Build The Simpler Times

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout game source (TheQuestionGame)
        uses: actions/checkout@v4
        with:
          repository: notmicrosoft2000-cmd/TheQuestionGame

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-2.0-0 libsdl2-mixer-2.0-0 libsdl2-image-2.0-0 libsdl2-ttf-2.0-0
          sudo apt-get install -y --no-install-recommends libasound2 || \
            sudo apt-get install -y --no-install-recommends libasound2t64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade pip && pip install pyinstaller && pip install -r games/firstcopy/requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm games/firstcopy/TheSimplerTimes-linux.spec

      - name: Package
        run: |
          test -f dist/TheSimplerTimes || exit 1
          chmod +x dist/TheSimplerTimes
          tar -czf TheSimplerTimes-linux.tar.gz -C dist TheSimplerTimes

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --repo notmicrosoft2000-cmd/TheSimplerTimes "${{ github.event.release.tag_name }}" TheSimplerTimes-linux.tar.gz --clobber

      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: TheSimplerTimes-linux
          path: TheSimplerTimes-linux.tar.gz

  windows:
    name: Build Windows .exe
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout game source (TheQuestionGame)
        uses: actions/checkout@v4
        with:
          repository: notmicrosoft2000-cmd/TheQuestionGame

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade pip && pip install pyinstaller && pip install -r games/firstcopy/requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm games/firstcopy/TheSimplerTimes.spec

      - name: Package
        run: |
          Test-Path dist/TheSimplerTimes.exe
          Copy-Item dist/TheSimplerTimes.exe TheSimplerTimes-Windows.exe
          Compress-Archive -Path TheSimplerTimes-Windows.exe -DestinationPath TheSimplerTimes-Windows.zip

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --repo notmicrosoft2000-cmd/TheSimplerTimes "${{ github.event.release.tag_name }}" TheSimplerTimes-Windows.zip --clobber

      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: TheSimplerTimes-Windows
          path: TheSimplerTimes-Windows.zip

  mac:
    name: Build macOS .dmg
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout game source (TheQuestionGame)
        uses: actions/checkout@v4
        with:
          repository: notmicrosoft2000-cmd/TheQuestionGame

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade pip && pip install py2app setuptools pygame numpy

      - name: Build app icon from windowq.png
        run: |
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s windowq.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s * 2)) $((s * 2)) windowq.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o icon.icns

      - name: Build .app with py2app
        run: python mac/setup-firstcopy.py py2app

      - name: Create .dmg
        run: |
          APP=$(find . -maxdepth 4 -name "*.app" -type d | head -1)
          echo "Found app: $APP"
          test -n "$APP"
          rm -rf dmgroot TheSimplerTimes-macOS.dmg
          mkdir -p dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create \
            -volname "The Simpler Times" \
            -srcfolder dmgroot \
            -ov -format UDZO \
            TheSimplerTimes-macOS.dmg

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --repo notmicrosoft2000-cmd/TheSimplerTimes "${{ github.event.release.tag_name }}" TheSimplerTimes-macOS.dmg --clobber

      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: TheSimplerTimes-macOS
          path: TheSimplerTimes-macOS.dmg
